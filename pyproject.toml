[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepface-local-api"
version = "0.1.0"
description = "Local FastAPI face recognition service on top of DeepFace directory datastore"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "deepface-local-api" }]
dependencies = [
  "deepface>=0.0.93",
  "tf-keras",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-multipart>=0.0.9",
  "numpy",
  "pandas",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
deepface-local-api = "deepface_local_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
